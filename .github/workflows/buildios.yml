name: Build Telegram-iOS
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read versions.json
        id: v
        run: echo "xcode=$(jq -r .xcode versions.json)" >> $GITHUB_OUTPUT

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.v.outputs.xcode }}

      - name: Make config
        run: |
          jq '.api_id="12345" | .api_hash="0123456789abcdef0123456789abcdef" | .enable_icloud=false | .enable_siri=false' \
            build-system/appstore-configuration.json > config.json
          sed 's/"api_hash": ".*"/"api_hash": "***"/' config.json

      - name: Import fake certificate
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ github.run_id }}
          restore-keys: bazel-

      - name: Build
        timeout-minutes: 330
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=config.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath=build/artifacts

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-ipa
          path: build/artifacts/Telegram.ipa
